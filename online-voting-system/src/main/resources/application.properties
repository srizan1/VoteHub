spring.application.name=online-voting-system
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://shortline.proxy.rlwy.net:50726/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JSON handling
spring.jackson.serialization.fail-on-empty-beans=false

# Use AntPathMatcher so SPA forward patterns with regex work (for /login, etc.)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Serve index.html at root
spring.web.resources.add-mappings=true



# twiilo details
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
